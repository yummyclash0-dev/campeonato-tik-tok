<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><meta name="description" content="Gerenciador de futebol - Campeonato do Tik Tok">
<link rel="manifest" href="manifest.webmanifest">
<title>Campeonato do Tik Tok</title>
<style>
:root{--bg:#050b14;--panel:#0c1727;--panel2:#101f33;--line:#203650;--blue:#29b6ff;--cyan:#52e5ff;--green:#55e6a5;--text:#edf6ff;--muted:#8ea6bf;--red:#ff657a;--gold:#ffd36a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% -10%,#12355b 0,transparent 42%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:#07111feF;border-bottom:1px solid var(--line);backdrop-filter:blur(14px);padding:14px max(16px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:900;letter-spacing:.4px}.brand span{color:var(--cyan)}.sub{font-size:11px;color:var(--muted);letter-spacing:1.6px}
button,select,input{font:inherit}button{border:1px solid var(--line);background:linear-gradient(135deg,#122943,#0b192b);color:var(--text);border-radius:12px;padding:10px 13px;cursor:pointer}button.primary{background:linear-gradient(135deg,#087cc5,#13b9d8);border:0;color:#001321;font-weight:800}button.danger{color:#ff9ba8;border-color:#6c2b3b}button:active{transform:scale(.98)}
main{max-width:1100px;margin:auto;padding:18px 14px 90px}.hero{padding:20px;border:1px solid #1e4262;border-radius:20px;background:linear-gradient(125deg,#102b49,#0b1728 68%);box-shadow:0 12px 40px #0005}
.hero h1{margin:3px 0 5px;font-size:clamp(23px,5vw,34px)}.hero p{margin:0;color:var(--muted)}.eyebrow{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.stat{padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.stat b{display:block;font-size:22px;color:var(--cyan)}.stat small{color:var(--muted)}
nav{display:flex;gap:7px;overflow:auto;margin:17px 0;padding-bottom:3px}nav button{white-space:nowrap}nav button.active{background:#123b5b;border-color:var(--blue);color:var(--cyan)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;margin:12px 0}.panel h2{font-size:18px;margin:0 0 12px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.team{padding:13px;background:var(--panel2);border:1px solid var(--line);border-radius:14px}.team strong{display:block}.team small{color:var(--muted)}
input,select{width:100%;background:#071321;border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text);outline:none}input:focus,select:focus{border-color:var(--blue)}label{display:block;font-size:12px;color:var(--muted);margin:8px 0 5px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.full{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:700}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.player{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}.shirt{width:39px;height:43px;display:grid;place-items:center;clip-path:polygon(20% 0,38% 8%,62% 8%,80% 0,100% 22%,82% 40%,76% 32%,76% 100%,24% 100%,24% 32%,18% 40%,0 22%);background:linear-gradient(145deg,#20bfff,#1263a5);color:white;font-weight:900}.playerinfo{flex:1;min-width:0}.playerinfo b{display:block}.playerinfo small{color:var(--muted)}
.score{font-size:27px;font-weight:900;letter-spacing:3px;color:var(--cyan)}.match{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.match:last-child{border:0}
.empty{padding:24px;text-align:center;color:var(--muted)}.pill{font-size:11px;padding:4px 8px;border-radius:30px;background:#12314a;color:var(--cyan)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20;padding:10px}.modal.show{display:flex}.sheet{width:min(620px,100%);max-height:90vh;overflow:auto;background:#0b1727;border:1px solid var(--line);border-radius:20px;padding:18px}.sheet h2{margin:0 0 10px}.close{float:right}
footer{text-align:center;color:#607b96;font-size:11px;padding:20px}
@media(min-width:700px){.modal{align-items:center}.stats{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body>
<header><div><div class="brand">TIK <span>TOK</span> FC</div><div class="sub">FOOTBALL MANAGER</div></div><button onclick="exportData()">Exportar dados</button></header>
<main>
<section class="hero"><div class="eyebrow">SUA CARREIRA COMEÇA AQUI</div><h1>Campeonato do Tik Tok</h1><p>Monte seus elencos, escale seus times e deixe a bola rolar.</p></section>
<div class="stats"><div class="stat"><b id="clubsN">60</b><small>Clubes</small></div><div class="stat"><b id="playersN">0</b><small>Jogadores cadastrados</small></div><div class="stat"><b>3</b><small>Divisões</small></div></div>
<nav id="tabs">
<button class="active" data-tab="inicio">Início</button><button data-tab="clubes">Clubes</button><button data-tab="jogadores">Jogadores</button><button data-tab="partidas">Partidas</button><button data-tab="tabela">Classificação</button><button data-tab="ranking">Rankings</button>
</nav>
<section id="view"></section>
<footer>CAMPEONATO DO TIK TOK • Seus dados ficam salvos neste aparelho</footer>
</main>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">Fechar ✕</button><div id="modalContent"></div></div></div>
<script>
const divisions={
"A":["Flamengo","Palmeiras","Cruzeiro","Mirassol","Fluminense","Bahia","Botafogo","São Paulo","Red Bull Bragantino","Corinthians","Grêmio","Vasco","Atlético-MG","Santos","Vitória","Internacional","Athletico-PR","Coritiba","Chapecoense","Remo"],
"B":["América-MG","Athletic","Atlético-GO","Avaí","Botafogo-SP","Ceará","CRB","Criciúma","Cuiabá","Fortaleza","Goiás","Juventude","Londrina","Náutico","Novorizontino","Operário-PR","Ponte Preta","São Bernardo","Sport","Vila Nova"],
"C":["Amazonas","Anápolis","Barra-SC","Botafogo-PB","Brusque","Caxias","Confiança","Ferroviária","Figueirense","Floresta","Guarani","Inter de Limeira","Itabaiana","Ituano","Maranhão","Maringá","Paysandu","Santa Cruz","Volta Redonda","Ypiranga-RS"]
};
const pos=["GOL","LD","ZAG","ZAG","LE","VOL","MC","MEI","PD","PE","ATA"];
let db=JSON.parse(localStorage.getItem("tiktokfc")||"null");
if(!db){db={teams:[],players:[],matches:[],round:1,scorers:{},assists:{},stats:{}};for(const d of ["A","B","C"])divisions[d].forEach(n=>db.teams.push({id:crypto.randomUUID(),name:n,div:d,points:0,w:0,d:0,l:0,gf:0,ga:0,players:[]}));}
function save(){localStorage.setItem("tiktokfc",JSON.stringify(db));updateStats()}
function team(id){return db.teams.find(t=>t.id===id)}
function updateStats(){document.getElementById("clubsN").textContent=db.teams.length;document.getElementById("playersN").textContent=db.players.length}
let current="inicio";
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");current=b.dataset.tab;render()});
function render(){const v=document.getElementById("view");if(current==="inicio")v.innerHTML=home();if(current==="clubes")v.innerHTML=clubs();if(current==="jogadores")v.innerHTML=players();if(current==="partidas")v.innerHTML=games();if(current==="tabela")v.innerHTML=table();if(current==="ranking")v.innerHTML=rankings()}
function home(){return `<div class="panel"><h2>Bem-vindo ao seu campeonato</h2><p class="muted">Os 60 clubes já estão cadastrados. Agora é sua vez de montar os elencos: cada clube tem espaço para até 10 jogadores.</p><div class="row"><button class="primary" onclick="switchTab('jogadores');openPlayer()">＋ Cadastrar jogador</button><button onclick="switchTab('partidas')">Ver partidas</button></div></div><div class="panel"><h2>Divisões</h2><div class="grid">${["A","B","C"].map(d=>`<div class="team"><span class="pill">SÉRIE ${d}</span><h3>${d==="A"?"Série A Tik Tok":d==="B"?"Série B Tik Tok":"Série C Tik Tok"}</h3><small>20 clubes • 38 rodadas • pontos corridos</small></div>`).join("")}</div></div><div class="panel"><h2>Regras do campeonato</h2><p class="muted">Futebol de campo: 2 tempos de 45 minutos, impedimento, cartões, faltas, pênaltis, escanteios e até 5 substituições. A simulação acontece em poucos segundos.</p><p class="tiny">Elencos incompletos podem jogar na simulação; complete os 11 titulares quando quiser.</p></div>`}
function switchTab(t){document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.tab===t));current=t;render()}
function clubs(){return `<div class="panel"><div class="row between"><h2>Clubes</h2><select id="divFilter" onchange="renderClubs()" style="max-width:170px"><option value="A">Série A</option><option value="B">Série B</option><option value="C">Série C</option><option value="all">Todas</option></select></div><div id="clubList" class="grid"></div></div>`}
function renderClubs(){let d=document.getElementById("divFilter")?.value||"A";let list=db.teams.filter(t=>d==="all"||t.div===d);document.getElementById("clubList").innerHTML=list.map(t=>`<div class="team"><div class="row between"><span class="pill">SÉRIE ${t.div}</span><small>${t.players.length}/10 atletas</small></div><strong>${t.name}</strong><small>${t.points} pts • ${t.w}V ${t.d}E ${t.l}D</small><div class="row" style="margin-top:10px"><button onclick="teamDetail('${t.id}')">Gerenciar elenco</button><button onclick="renameTeam('${t.id}')">Editar nome</button></div></div>`).join("")}
function players(){return `<div class="panel"><div class="row between"><h2>Jogadores</h2><button class="primary" onclick="openPlayer()">＋ Novo jogador</button></div><label>Filtrar por clube</label><select id="playerFilter" onchange="renderPlayers()"><option value="all">Todos os clubes</option>${db.teams.map(t=>`<option value="${t.id}">${t.name} (Série ${t.div})</option>`).join("")}</select><div id="playerList"></div></div>`}
function renderPlayers(){let id=document.getElementById("playerFilter")?.value||"all";let list=db.players.filter(p=>id==="all"||p.teamId===id);document.getElementById("playerList").innerHTML=list.length?list.map(p=>`<div class="player"><div class="shirt">${p.number}</div><div class="playerinfo"><b>${p.name}</b><small>${team(p.teamId)?.name||"Sem clube"} • ${p.position} • OVER ${p.over}</small></div><button onclick="editPlayer('${p.id}')">Editar</button><button class="danger" onclick="deletePlayer('${p.id}')">✕</button></div>`).join(""):`<div class="empty">Nenhum jogador cadastrado ainda.</div>`}
function openPlayer(p=null){document.getElementById("modalContent").innerHTML=`<h2>${p?"Editar jogador":"Cadastrar jogador"}</h2><form id="playerForm" onsubmit="savePlayer(event,'${p?.id||""}')"><div class="formgrid"><div class="full"><label>Nome do jogador</label><input name="name" required value="${p?.name||""}" placeholder="Nome completo"></div><div><label>Número da camisa</label><input name="number" type="number" min="1" max="99" required value="${p?.number||""}"></div><div><label>Posição</label><select name="position">${["GOL","LD","ZAG","LE","VOL","MC","MEI","PD","PE","ATA"].map(x=>`<option ${p?.position===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="full"><label>Clube</label><select name="teamId" required>${db.teams.map(t=>`<option value="${t.id}" ${p?.teamId===t.id?"selected":""}>${t.name} • Série ${t.div}</option>`).join("")}</select></div><div class="full"><label>Principal qualidade</label><select name="quality"><option>Passe</option><option>Finalização</option><option>Velocidade</option><option>Drible</option><option>Marcação</option><option>Força</option><option>Defesa (goleiro)</option></select></div></div><p class="tiny">Os atributos serão gerados automaticamente, com bônus na qualidade escolhida. Você poderá editar tudo depois.</p><button class="primary" style="width:100%;margin-top:10px">Salvar jogador</button></form>`;showModal()}
function savePlayer(e,id){e.preventDefault();let f=new FormData(e.target),tid=f.get("teamId"),t=team(tid);if(!id&&t.players.length>=10){alert("Este clube já tem 10 jogadores. Remova alguém ou escolha outro clube.");return}let old=id?db.players.find(p=>p.id===id):null;if(old&&old.teamId!==tid&&t.players.length>=10){alert("O clube escolhido já tem 10 jogadores.");return}
let quality=f.get("quality");let attrs={passe:rand(),finalizacao:rand(),velocidade:rand(),drible:rand(),marcacao:rand(),forca:rand(),defesa:rand()};let key=quality==="Defesa (goleiro)"?"defesa":quality.toLowerCase();attrs[key]=Math.min(99,attrs[key]+18);let over=Math.round(Object.values(attrs).reduce((a,b)=>a+b,0)/7);
if(old){team(old.teamId).players=team(old.teamId).players.filter(x=>x!==id);Object.assign(old,{name:f.get("name"),number:+f.get("number"),position:f.get("position"),teamId:tid,quality,attrs,over});}else{let p={id:crypto.randomUUID(),name:f.get("name"),number:+f.get("number"),position:f.get("position"),teamId:tid,quality,attrs,over};db.players.push(p);t.players.push(p.id)}
save();closeModal();render()}
function rand(){return Math.floor(Math.random()*36)+50}
function editPlayer(id){openPlayer(db.players.find(p=>p.id===id))}
function deletePlayer(id){if(!confirm("Excluir este jogador?"))return;let p=db.players.find(x=>x.id===id);team(p.teamId).players=team(p.teamId).players.filter(x=>x!==id);db.players=db.players.filter(x=>x.id!==id);save();render()}
function teamDetail(id){let t=team(id),ps=db.players.filter(p=>p.teamId===id);document.getElementById("modalContent").innerHTML=`<h2>${t.name}</h2><p class="muted">Série ${t.div} • ${ps.length}/10 jogadores</p>${ps.map(p=>`<div class="player"><div class="shirt">${p.number}</div><div class="playerinfo"><b>${p.name}</b><small>${p.position} • OVER ${p.over}</small></div><button onclick="closeModal();editPlayer('${p.id}')">Editar</button></div>`).join("")||'<div class="empty">Elenco vazio. Cadastre seus jogadores.</div>'}<button class="primary" style="width:100%;margin-top:12px" onclick="closeModal();switchTab('jogadores');openPlayerFor('${id}')">＋ Adicionar jogador</button>`;showModal()}
function openPlayerFor(id){openPlayer();document.querySelector('#playerForm select[name="teamId"]').value=id}
function renameTeam(id){let t=team(id),n=prompt("Novo nome do clube:",t.name);if(n?.trim()){t.name=n.trim();save();render()}}
function games(){return `<div class="panel"><div class="row between"><div><h2>Rodada ${db.round} de 38</h2><small class="muted">Simulação rápida • 90 minutos</small></div><button class="primary" onclick="simulateRound()">Simular rodada ⚽</button></div><p class="tiny">As partidas são simuladas em poucos segundos. Para cada divisão, os clubes se enfrentam em turno e returno.</p></div><div class="panel"><h2>Resultados recentes</h2>${db.matches.slice(-12).reverse().map(m=>`<div class="match"><div style="flex:1">${team(m.home)?.name||"Clube"}<br><small class="muted">${team(m.away)?.name||"Clube"}</small></div><div class="score">${m.hg} × ${m.ag}</div><div style="text-align:right;min-width:100px"><small>${m.events.length} eventos</small><br><button onclick="matchDetail('${m.id}')">Detalhes</button></div></div>`).join("")||'<div class="empty">Nenhuma partida simulada. Clique em “Simular rodada”.</div>'}</div>`}
function simulateRound(){for(let d of ["A","B","C"]){let ts=db.teams.filter(t=>t.div===d);let shift=(db.round-1)%19+1;let pairs=[];for(let i=0;i<10;i++){let a=ts[i],b=ts[19-i];if((db.round%2)===0)[a,b]=[b,a];pairs.push([a,b])}for(let [h,a] of pairs){let hp=h.players.map(id=>db.players.find(p=>p.id===id)).filter(Boolean),ap=a.players.map(id=>db.players.find(p=>p.id===id)).filter(Boolean);let power=arr=>arr.length?arr.reduce((s,p)=>s+p.over,0)/arr.length:50;let hg=goals(power(hp),power(ap)),ag=goals(power(ap),power(hp));let events=[];for(let x=0;x<hg;x++)events.push(event(h,hp,"gol"));for(let x=0;x<ag;x++)events.push(event(a,ap,"gol"));if(Math.random()<.6)events.push({type:"cartão amarelo",minute:Math.ceil(Math.random()*90),team:Math.random()<.5?h.name:a.name});if(Math.random()<.12)events.push({type:"cartão vermelho",minute:Math.ceil(Math.random()*90),team:Math.random()<.5?h.name:a.name});let m={id:crypto.randomUUID(),round:db.round,div:d,home:h.id,away:a.id,hg,ag,events};db.matches.push(m);h.gf+=hg;h.ga+=ag;a.gf+=ag;a.ga+=hg;if(hg>ag){h.w++;h.points+=3;a.l++}else if(ag>hg){a.w++;a.points+=3;h.l++}else{h.d++;a.d++;h.points++;a.points++}}}
db.round=db.round%38+1;save();render();alert("Rodada simulada! Confira os resultados e a classificação.")}
function goals(p,o){let strength=(p-o)/35;let n=Math.max(0,Math.round((Math.random()*2.2+0.2)+strength));return Math.min(6,n)}
function event(t,ps,type){let p=ps.length?ps[Math.floor(Math.random()*ps.length)]:null;if(p){db.scorers[p.id]=(db.scorers[p.id]||0)+1;if(Math.random()<.55){let mate=ps.find(x=>x.id!==p.id);if(mate)db.assists[mate.id]=(db.assists[mate.id]||0)+1}}return {type,minute:Math.ceil(Math.random()*90),team:t.name,player:p?.name||"Jogador não cadastrado"}}
function matchDetail(id){let m=db.matches.find(x=>x.id===id);document.getElementById("modalContent").innerHTML=`<h2>${team(m.home).name} ${m.hg} × ${m.ag} ${team(m.away).name}</h2><p class="muted">Série ${m.div} • Rodada ${m.round} • 90 minutos</p>${m.events.sort((a,b)=>a.minute-b.minute).map(e=>`<div class="player"><span class="pill">${e.minute}'</span><div class="playerinfo"><b>${e.type.toUpperCase()}</b><small>${e.player||""} • ${e.team}</small></div></div>`).join("")||'<p class="muted">Partida sem eventos registrados.</p>'}`;showModal()}
function table(){return `<div class="panel"><div class="row between"><h2>Classificação</h2><select id="tableDiv" onchange="renderTable()" style="max-width:150px"><option>A</option><option>B</option><option>C</option></select></div><div id="tableContent"></div></div>`}
function renderTable(){let d=document.getElementById("tableDiv")?.value||"A";let ts=db.teams.filter(t=>t.div===d).sort((a,b)=>b.points-a.points||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);document.getElementById("tableContent").innerHTML=`<table><thead><tr><th>#</th><th>Clube</th><th class="num">PTS</th><th class="num">J</th><th class="num">V</th><th class="num">E</th><th class="num">D</th><th class="num">SG</th></tr></thead><tbody>${ts.map((t,i)=>`<tr><td>${i+1}</td><td>${t.name}</td><td class="num"><b>${t.points}</b></td><td class="num">${t.w+t.d+t.l}</td><td class="num">${t.w}</td><td class="num">${t.d}</td><td class="num">${t.l}</td><td class="num">${t.gf-t.ga}</td></tr>`).join("")}</tbody></table><p class="tiny">As quatro últimas posições são zona de rebaixamento nas Séries A e B. As quatro primeiras da B e C são zona de acesso.</p>`}
function rankings(){let top=Object.entries(db.scorers).sort((a,b)=>b[1]-a[1]).slice(0,10),ass=Object.entries(db.assists).sort((a,b)=>b[1]-a[1]).slice(0,10);let row=(arr)=>arr.map(([id,n],i)=>{let p=db.players.find(x=>x.id===id);return `<tr><td>${i+1}</td><td>${p?.name||"Jogador"}</td><td>${team(p?.teamId)?.name||""}</td><td class="num">${n}</td></tr>`}).join("");return `<div class="panel"><h2>Artilharia</h2>${top.length?`<table><tr><th>#</th><th>Jogador</th><th>Clube</th><th class="num">Gols</th></tr>${row(top)}</table>`:'<div class="empty">Ainda sem gols registrados.</div>'}</div><div class="panel"><h2>Assistências</h2>${ass.length?`<table><tr><th>#</th><th>Jogador</th><th>Clube</th><th class="num">AST</th></tr>${row(ass)}</table>`:'<div class="empty">Ainda sem assistências.</div>'}</div>`}
function showModal(){document.getElementById("modal").classList.add("show")}function closeModal(){document.getElementById("modal").classList.remove("show")}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="campeonato-do-tik-tok-backup.json";a.click();URL.revokeObjectURL(a.href)}
function restore(){save();render()}
render();updateStats();
setTimeout(()=>{if(current==="clubes")renderClubs();if(current==="jogadores")renderPlayers();if(current==="tabela")renderTable()},0);
const oldRender=render;render=function(){oldRender();if(current==="clubes")renderClubs();if(current==="jogadores")renderPlayers();if(current==="tabela")renderTable()};
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
